[project]
name = "gpt-from-scratch"
version = "0.2.0"
description = "A from-scratch PyTorch implementation of a GPT-style LLM, following Sebastian Raschka's Build a Large Language Model (From Scratch)"
readme = "README.md"
authors = [
    { name = "Ali Zamani", email = "zamaniali1995@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "tiktoken>=0.5",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.7",
]
all = [
    "gpt-from-scratch[dev]",
    "gpt-from-scratch[notebook]",
]

[project.scripts]
train-gpt = "gpt_from_scratch.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_from_scratch"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
